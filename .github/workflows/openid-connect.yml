name: OpenID Connect

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  connect:
    name: Verify GitHub OIDC authentication
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gh-oidc-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 900
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Confirm assumed AWS identity
        run: |
          aws sts get-caller-identity > /dev/null
          echo "OIDC authentication succeeded."

      - name: Verify the allowed IAM operation
        run: |
          aws iam list-users --max-items 1 > /dev/null
          echo "IAM permission check succeeded."
